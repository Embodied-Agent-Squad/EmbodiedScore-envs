[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embodiedscore-envs"
version = "0.1.0"
description = "Gymnasium environments for embodied-AI benchmarks (VLN-CE first), on a frozen habitat-sim 0.3.3"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "gymnasium>=1.3",
    "numpy>=1.24,<2",
    "numpy-quaternion",
    "fastdtw",
]
# habitat-sim is NOT a pip dependency: install it from
# https://github.com/Embodied-Agent-Squad/EmbodiedScore-habitat (see its BUILD.md).

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["embodiedscore_envs*"]
